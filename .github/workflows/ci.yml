name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (offline - fake LLM, SQLite, in-memory Qdrant, real MCP server over stdio)
        run: pytest -v

  postgres-pipeline:
    # proves the pipeline + SQL tools also work on PostgreSQL, not just SQLite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campaignpilot
          POSTGRES_PASSWORD: campaignpilot
          POSTGRES_DB: campaignpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campaignpilot" --health-interval 5s --health-retries 10
    env:
      LLM_PROVIDER: fake
      TOOLS_MODE: direct
      QDRANT_URL: memory
      DATABASE_URL: postgresql+psycopg2://campaignpilot:campaignpilot@localhost:5432/campaignpilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m campaignpilot.pipeline.run
      - run: python -m campaignpilot.cli "Convert active free users to Pro with an email" --auto-approve

  docker:
    # builds the deploy image and checks the single-container start-up actually serves the app
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t campaignpilot:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name cp -p 8000:8000 -e LLM_PROVIDER=fake campaignpilot:ci
          for i in $(seq 1 60); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/ | grep -q CampaignPilot
          curl -fs -X POST "localhost:8000/campaigns?wait=true" -H 'Content-Type: application/json' \
            -d '{"goal": "Convert active free users to Pro with an email"}' | grep -q awaiting_approval
      - if: failure()
        run: docker logs cp
