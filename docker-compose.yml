# Easiest start: double-click start.bat (Windows) or run ./start.sh (Mac/Linux).
# Manual:  docker compose up -d --build   then open http://localhost:8000
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg2://campaignpilot:campaignpilot@postgres:5432/campaignpilot
    QDRANT_URL: http://qdrant:6333
    CHECKPOINT_DB: /app/data/checkpoints.sqlite
  volumes:
    - appdata:/app/data
  depends_on:
    postgres:
      condition: service_healthy
    qdrant:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campaignpilot
      POSTGRES_PASSWORD: campaignpilot
      POSTGRES_DB: campaignpilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaignpilot"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["6333:6333"]   # dashboard: http://localhost:6333/dashboard
    volumes: [qdrantdata:/qdrant/storage]
    restart: unless-stopped

  # Loads the warehouse and indexes the knowledge base, then refreshes every hour.
  pipeline:
    <<: *app
    command: ["python", "-m", "campaignpilot.pipeline.run", "--every", "3600"]
    restart: unless-stopped

  # Web app + API: http://localhost:8000
  app:
    <<: *app
    command: ["python", "-m", "uvicorn", "campaignpilot.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  appdata:
