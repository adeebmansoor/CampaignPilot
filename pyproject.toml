[project]
name = "campaignpilot"
version = "1.0.0"
description = "Multi-agent marketing campaign assistant: LangGraph + RAG (Qdrant) + MCP"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # long strings in prompts/fixtures are fine
